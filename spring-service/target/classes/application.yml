server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: spring-service

  datasource:
    url: jdbc:mysql://localhost:3306/student_performance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: MySQL@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:yourmail@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: "c2VjcmV0LWtleS1mb3Itc3R1ZGVudC1wZXJmb3JtYW5jZS1zeXN0ZW0tMzItYnl0ZXMtbG9uZw=="
    expiration-ms: 86400000            # 24 hours
    remember-me-expiration-ms: 604800000 # 7 days
  otp:
    expiry-minutes: 15
    length: 6
  ai-service:
    base-url: http://localhost:5000
    timeout-seconds: 30
  upload:
    dir: ./uploads
    max-size-mb: 5
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8081"

logging:
  level:
    root: INFO
    com.student.performance: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
