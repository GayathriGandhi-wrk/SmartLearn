<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    ThemeManager.init();
    if (!API.isAuthenticated()) window.location.href = "/pages/auth/login.html";

    UI.renderShell(UI.roleItems(), "/pages/admin/profile.html", "My Profile");
    const content = document.getElementById("page-content");

    content.innerHTML = `
      <div class="card p-4 mb-3 text-center">
        <div id="profile-avatar" class="mx-auto mb-3" style="width:96px;height:96px;border-radius:50%;background:var(--gradient);display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:800;">A</div>
        <h5 class="fw-bold mb-0" id="p-name">-</h5>
        <div class="text-muted small" id="p-email">-</div>
        <div class="mt-2" id="p-role"></div>
        <div class="d-flex justify-content-center gap-3 mt-3">
          <div><div class="fw-bold" id="p-status">-</div><div class="text-muted small">Account</div></div>
          <div><div class="fw-bold" id="p-verify">-</div><div class="text-muted small">Verified</div></div>
        </div>
      </div>

      <div class="card p-4">
        <h6 class="fw-bold mb-3"><i class="bi bi-person-lines-fill me-2"></i>Admin Details</h6>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-muted small mb-0">Full name</label>
            <div class="fs-5 fw-semibold" id="d-name">-</div>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-0">User ID</label>
            <div class="fs-5 fw-semibold" id="d-userid">-</div>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-0">Email address</label>
            <div class="fs-5 fw-semibold" id="d-email">-</div>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-0">Phone number</label>
            <div class="fs-5 fw-semibold" id="d-phone">-</div>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-0">Role</label>
            <div class="fs-5 fw-semibold" id="d-role">-</div>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-0">Account status</label>
            <div class="fs-5 fw-semibold" id="d-status">-</div>
          </div>
        </div>
      </div>`;

    async function loadProfile() {
      try {
        const res = await API.get("/auth/me");
        const p = res.data || {};
        document.getElementById("p-name").textContent = p.fullName || "-";
        document.getElementById("p-email").textContent = p.email || "";
        document.getElementById("d-name").textContent = p.fullName || "-";
        document.getElementById("d-userid").textContent = p.userId ?? "-";
        document.getElementById("d-email").textContent = p.email || "-";
        document.getElementById("d-phone").textContent = p.phone || "-";
        document.getElementById("d-role").textContent = p.role || "-";
        document.getElementById("p-status").textContent = p.active ? "Active" : "Inactive";
        document.getElementById("d-status").textContent = p.active ? "Active" : "Inactive";
        document.getElementById("p-verify").textContent = p.verified ? "Yes" : "No";
        document.getElementById("p-role").innerHTML =
          `<span class="badge ${p.role === "ADMIN" ? "badge-soft-orange" : "badge-soft-primary"}">${UI.safeHtml(p.role || "ADMIN")}</span>`;
        if (p.fullName) document.getElementById("profile-avatar").textContent = UI.initials(p.fullName);
      } catch (e) {
        UI.showToast("Failed to load profile: " + e.message, "danger");
      }
    }

    loadProfile();
  </script>
</body>
</html>
