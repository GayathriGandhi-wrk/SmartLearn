<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Questions - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    ThemeManager.init();
    if (!API.isAuthenticated()) window.location.href = "/pages/auth/login.html";
    const user = API.getUser();
    if (!user || user.role !== "ADMIN") window.location.href = "/pages/student/dashboard.html";

    UI.renderShell(UI.roleItems(), "/pages/admin/questions.html", "Manage Questions");
    const content = document.getElementById("page-content");

    content.innerHTML = `
      <div class="card p-3">
        <h6 class="fw-bold mb-3"><i class="bi bi-card-text me-2"></i>Question Bank</h6>
        <div id="question-stats" class="d-flex gap-3 mb-3"></div>
        <div id="question-table"><div class="spinner"></div></div>
      </div>`;

    async function loadAdminQuestions() {
      const stats = document.getElementById("question-stats");
      const box = document.getElementById("question-table");
      try {
        const [counts, res] = await Promise.all([
          API.get("/questions/counts"),
          API.get("/questions?page=0&size=10"),
        ]);
        const c = counts.data;
        stats.innerHTML = `
          <span class="badge badge-soft">Total ${c.totalQuestions ?? 0}</span>
          <span class="badge badge-soft-green">Beginner ${c.beginnerCount ?? 0}</span>
          <span class="badge badge-soft-orange">Intermediate ${c.intermediateCount ?? 0}</span>
          <span class="badge badge-soft-red">Advanced ${c.advancedCount ?? 0}</span>`;
        const questions = (res.data && res.data.questions) || [];
        if (!questions.length) { box.innerHTML = `<div class="empty-state">No questions.</div>`; return; }
        box.innerHTML = `<div class="table-responsive"><table class="table table-hover">
          <thead><tr><th>Question</th><th>Subject</th><th>Difficulty</th><th>Marks</th></tr></thead>
          <tbody>${questions.map((q) => `
            <tr>
              <td class="small">${UI.safeHtml(q.questionText || "").slice(0, 90)}...</td>
              <td>${UI.safeHtml(q.subjectName || "")}</td>
              <td><span class="badge ${q.difficulty === "ADVANCED" ? "badge-soft-red" : q.difficulty === "INTERMEDIATE" ? "badge-soft-orange" : "badge-soft-green"}">${UI.safeHtml(q.difficulty || "")}</span></td>
              <td>${q.marks ?? 1}</td>
            </tr>`).join("")}
          </tbody></table></div>`;
      } catch (e) {
        stats.innerHTML = "";
        box.innerHTML = `<div class="empty-state"><p>${UI.safeHtml(e.message)}</p></div>`;
      }
    }

    loadAdminQuestions();
  </script>
</body>
</html>
