<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />    
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card p-4 animate">
      <div class="auth-logo" style="background:linear-gradient(135deg,#e17055,#fab1a0);"><i class="bi bi-key"></i></div>
      <h3 class="auth-title mb-1">Forgot password?</h3>
      <p class="auth-subtitle mb-4" id="page-subtitle">Enter your email and we'll send you an OTP to reset it.</p>

      <!-- Step 1: Enter email -->
      <form id="forgot-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <div class="input-icon">
            <i class="icon bi bi-envelope"></i>
            <input type="email" class="form-control" name="email" placeholder="you@example.com" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-send me-2"></i>Send OTP</button>
      </form>

      <!-- Step 2: Enter OTP + new password (shown after OTP is sent) -->
      <form id="reset-form" novalidate hidden>
        <div class="alert alert-success py-2 small" id="otp-sent-msg"><i class="bi bi-envelope-check me-2"></i>OTP sent to <strong id="sent-email"></strong></div>
        <div class="alert alert-warning py-2 small" id="dev-otp-box" hidden>
          <i class="bi bi-info-circle me-2"></i>Email is disabled in dev mode. Your OTP: <strong id="dev-otp"></strong>
        </div>
        <div class="mb-3">
          <label class="form-label">OTP code</label>
          <div class="input-icon">
            <i class="icon bi bi-123"></i>
            <input type="text" class="form-control" name="otpCode" placeholder="6-digit code" required maxlength="6" pattern="\d{6}" inputmode="numeric" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <div class="input-icon">
            <i class="icon bi bi-lock"></i>
            <input type="password" class="form-control" name="newPassword" placeholder="Min 8 chars" required minlength="8" />
          </div>
          <div class="form-text" style="font-size:0.75rem;">Uppercase, lowercase, digit &amp; special char</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button type="button" class="btn btn-sm btn-ghost" id="resend-btn" disabled>
            <i class="bi bi-arrow-clockwise me-1"></i>Resend OTP <span id="resend-timer"></span>
          </button>
          <span class="small text-muted" id="otp-timer-label"><i class="bi bi-hourglass-split me-1"></i>Valid for <span id="otp-timer" class="fw-bold">00:30</span></span>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-check-circle me-2"></i>Reset Password</button>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:0.9rem;">
        Remembered? <a href="/pages/auth/login.html">Back to login</a>
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    ThemeManager.init();
    AuthPage.requireLoggedOut();

    const forgotForm = document.getElementById("forgot-form");
    const resetForm = document.getElementById("reset-form");
    const resendBtn = document.getElementById("resend-btn");
    const otpTimerEl = document.getElementById("otp-timer");
    const resendTimerEl = document.getElementById("resend-timer");
    const devOtpBox = document.getElementById("dev-otp-box");
    const devOtpEl = document.getElementById("dev-otp");
    const sentEmailEl = document.getElementById("sent-email");

    let currentEmail = "";
    let otpSeconds = 30;
    let otpTimerId = null;

    function fmt(s) {
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return `${m}:${sec}`;
    }

    function startTimer() {
      otpSeconds = 30;
      otpTimerEl.textContent = fmt(otpSeconds);
      resendBtn.disabled = true;
      resendTimerEl.textContent = fmt(otpSeconds);
      clearInterval(otpTimerId);
      otpTimerId = setInterval(() => {
        otpSeconds--;
        otpTimerEl.textContent = fmt(otpSeconds);
        resendTimerEl.textContent = fmt(otpSeconds);
        if (otpSeconds <= 0) {
          clearInterval(otpTimerId);
          otpTimerEl.textContent = "00:00";
          resendTimerEl.textContent = "";
          resendBtn.disabled = false;
        }
      }, 1000);
    }

    function showResetForm(email, res) {
      currentEmail = email;
      document.getElementById("reset-email-input")?.remove();
      sentEmailEl.textContent = email;
      forgotForm.hidden = true;
      resetForm.hidden = false;
      const data = res && res.data;
      if (data && data.devOtp) {
        devOtpBox.hidden = false;
        devOtpEl.textContent = data.devOtp;
        resetForm.querySelector('[name="otpCode"]').placeholder = data.devOtp;
      } else {
        devOtpBox.hidden = true;
      }
      startTimer();
    }

    // Step 1: send OTP
    AuthPage.bindForm("forgot-form", async (form) => {
      const data = Object.fromEntries(form.entries());
      const res = await API.post("/auth/forgot-password", data);
      localStorage.setItem("sp_reset_email", data.email);
      UI.showToast("OTP sent to your email!", "success");
      showResetForm(data.email, res);
    });

    // Resend OTP (restarts the 30s timer)
    resendBtn.addEventListener("click", async () => {
      resendBtn.disabled = true;
      try {
        const res = await API.post("/auth/forgot-password", { email: currentEmail });
        const data = res && res.data;
        if (data && data.devOtp) {
          devOtpBox.hidden = false;
          devOtpEl.textContent = data.devOtp;
          resetForm.querySelector('[name="otpCode"]').placeholder = data.devOtp;
        }
        resetForm.querySelector('[name="otpCode"]').value = "";
        UI.showToast("New OTP sent!", "success");
        startTimer();
      } catch (err) {
        UI.showToast(`<i class="bi bi-exclamation-triangle me-2"></i>${UI.safeHtml(err.message)}`, "danger");
        startTimer();
      }
    });

    // Step 2: verify OTP + set new password
    AuthPage.bindForm("reset-form", async (form) => {
      const data = Object.fromEntries(form.entries());
      data.email = currentEmail;
      await API.post("/auth/reset-password", data);
      localStorage.removeItem("sp_reset_email");
      clearInterval(otpTimerId);
      UI.showToast("Password reset successfully! Please login.", "success");
      setTimeout(() => (window.location.href = "/pages/auth/login.html"), 1200);
    });
  </script>
</body>
</html>
