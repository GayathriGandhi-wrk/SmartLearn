<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card p-4 animate">
      <div class="auth-logo"><i class="bi bi-graph-up-arrow"></i></div>
      <h3 class="auth-title mb-1">Welcome back</h3>
      <p class="auth-subtitle mb-4">Login to continue your learning journey</p>

      <form id="login-form" novalidate autocomplete="off">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <div class="input-icon">
            <i class="icon bi bi-envelope"></i>
            <input type="email" class="form-control" name="email" placeholder="you@example.com" autocomplete="off" required />
          </div>
          <div class="invalid-feedback" id="login-email-error" style="display:none;color:#dc3545;font-size:0.8rem;margin-top:4px;"></div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label">Password</label>
            <a href="/pages/auth/forgot-password.html" style="font-size:0.85rem;">Forgot password?</a>
          </div>
          <div class="input-icon">
            <i class="icon bi bi-lock"></i>
            <input type="password" class="form-control pw-input" name="password" placeholder="Enter your password" autocomplete="new-password" required />
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
          <div class="invalid-feedback" id="login-password-error" style="display:none;color:#dc3545;font-size:0.8rem;margin-top:4px;"></div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" />
          <label class="form-check-label" for="rememberMe" style="font-size:0.9rem;">Remember me for 7 days</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:0.9rem;">
        Don't have an account? <a href="/pages/auth/register.html">Register here</a>
      </p>
      <p class="text-center mt-2 mb-0" style="font-size:0.75rem;color:var(--text-muted);">
        Demo: admin@studentai.com / Admin@123 &middot; student1@studentai.com / Student@123
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    ThemeManager.init();
    const loginForm = document.getElementById("login-form");
    loginForm.reset();
    setTimeout(() => {
      loginForm.querySelectorAll('input').forEach((i) => { i.value = ""; });
    }, 50);
    AuthPage.requireLoggedOut();

    const emailInput = document.querySelector('#login-form input[name="email"]');
    const emailError = document.getElementById("login-email-error");

    function validateEmail() {
      const v = emailInput.value.trim();
      if (!v) {
        emailInput.classList.remove("is-invalid");
        emailError.style.display = "none";
        return true;
      }
      const valid = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v);
      if (!valid) {
        emailInput.classList.add("is-invalid");
        emailError.textContent = "Please enter a valid email address.";
        emailError.style.display = "block";
        return false;
      }
      emailInput.classList.remove("is-invalid");
      emailError.style.display = "none";
      return true;
    }
    emailInput.addEventListener("input", validateEmail);

    const passwordInput = document.querySelector('#login-form input[name="password"]');
    const passwordError = document.getElementById("login-password-error");

    function validatePassword() {
      const v = passwordInput.value;
      if (!v) {
        passwordInput.classList.remove("is-invalid");
        passwordError.style.display = "none";
        return true;
      }
      let msg = "";
      if (v.length < 8) {
        msg = "Password must be at least 8 characters.";
      } else if (!/[A-Z]/.test(v)) {
        msg = "Password must contain an uppercase letter (A-Z).";
      } else if (!/[a-z]/.test(v)) {
        msg = "Password must contain a lowercase letter (a-z).";
      } else if (!/\d/.test(v)) {
        msg = "Password must contain a digit (0-9).";
      } else if (!/[@$!%*?&]/.test(v)) {
        msg = "Password must contain a special character (@ $ ! % * ? &).";
      }
      if (msg) {
        passwordInput.classList.add("is-invalid");
        passwordError.textContent = msg;
        passwordError.style.display = "block";
        return false;
      }
      passwordInput.classList.remove("is-invalid");
      passwordError.style.display = "none";
      return true;
    }
    passwordInput.addEventListener("input", validatePassword);

    document.querySelectorAll("[data-pw-toggle]").forEach((btn) =>
      btn.addEventListener("click", () => {
        const input = btn.closest(".input-icon").querySelector('input[type="password"], input[type="text"]');
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        validatePassword();
      })
    );

    AuthPage.bindForm("login-form", async (form) => {
      if (!validateEmail()) {
        throw new Error("Please enter a valid email address");
      }
      if (!validatePassword()) {
        throw new Error("Please correct the Password field");
      }
      const data = Object.fromEntries(form.entries());
      data.rememberMe = form.get("rememberMe") === "on";
      const res = await API.post("/auth/login", {
        email: data.email,
        password: data.password,
        rememberMe: data.rememberMe,
      });
      const d = res.data;
      API.setToken(d.token);
      API.setUser({
        userId: d.userId,
        email: d.email,
        fullName: d.fullName,
        role: d.role,
        studentId: d.studentId,
        verified: d.verified,
      });
      UI.showToast("Login successful. Welcome back!", "success");
      setTimeout(() => {
        const user = API.getUser();
        window.location.href = user && user.role === "ADMIN" ? "/pages/admin/students.html" : "/pages/student/dashboard.html";
      }, 1200);
    });
  </script>
</body>
</html>
