<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card p-4 animate">
      <div class="auth-logo" style="background:linear-gradient(135deg,#8b5cf6,#ddd6fe);"><i class="bi bi-shield-check"></i></div>
      <h3 class="auth-title mb-1">Reset password</h3>
      <p class="auth-subtitle mb-4">Enter the OTP sent to your email and choose a new password.</p>

      <form id="reset-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" id="reset-email" readonly />
        </div>
        <div class="mb-3">
          <label class="form-label">OTP code</label>
          <div class="input-icon">
            <i class="icon bi bi-123"></i>
            <input type="text" class="form-control" name="otpCode" placeholder="6-digit code" required maxlength="6" pattern="\d{6}" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <div class="input-icon">
            <i class="icon bi bi-lock"></i>
            <input type="password" class="form-control" name="newPassword" placeholder="Min 8 chars" required minlength="8" />
          </div>
          <div class="form-text" style="font-size:0.75rem;">Uppercase, lowercase, digit &amp; special char</div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-check-circle me-2"></i>Reset Password</button>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:0.9rem;">
        Back to <a href="/pages/auth/login.html">login</a>
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    ThemeManager.init();
    const email = localStorage.getItem("sp_reset_email");
    if (!email) window.location.href = "/pages/auth/forgot-password.html";
    document.getElementById("reset-email").value = email;

    AuthPage.bindForm("reset-form", async (form) => {
      const data = Object.fromEntries(form.entries());
      await API.post("/auth/reset-password", data);
      localStorage.removeItem("sp_reset_email");
      UI.showToast("Password reset successfully! Please login.", "success");
      setTimeout(() => (window.location.href = "/pages/auth/login.html"), 1200);
    });
  </script>
</body>
</html>
