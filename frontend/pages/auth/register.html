<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card p-4 animate">
      <div class="auth-logo"><i class="bi bi-person-plus"></i></div>
      <h3 class="auth-title mb-1">Create your account</h3>
      <p class="auth-subtitle mb-4">Join Smart Learn and start improving</p>

      <form id="register-form" novalidate autocomplete="off">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Full name</label>
            <div class="input-icon">
              <i class="icon bi bi-person"></i>
              <input type="text" class="form-control" name="fullName" placeholder="e.g. Rahul Kumar" autocomplete="off" required minlength="3" pattern="^[A-Z][A-Za-z ]*$" />
            </div>
            <div class="invalid-feedback" id="name-error" style="display:none;color:#dc3545;font-size:0.8rem;margin-top:4px;"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email address</label>
            <div class="input-icon">
              <i class="icon bi bi-envelope"></i>
              <input type="email" class="form-control" name="email" placeholder="you@example.com" autocomplete="off" required />
            </div>
            <div class="invalid-feedback" id="email-error" style="display:none;color:#dc3545;font-size:0.8rem;margin-top:4px;"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <div class="input-icon">
              <i class="icon bi bi-telephone"></i>
              <input type="tel" class="form-control" name="phone" placeholder="10-digit mobile number" autocomplete="off" required maxlength="10" />
            </div>
            <div class="invalid-feedback" id="phone-error" style="display:none;color:#dc3545;font-size:0.8rem;margin-top:4px;"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Department</label>
            <select class="form-select" name="department" required>
              <option value="">Select...</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Biology">Biology</option>
              <option value="Commerce">Commerce</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <div class="input-icon">
              <i class="icon bi bi-lock"></i>
              <input type="password" class="form-control pw-input" name="password" placeholder="Min 8 chars" autocomplete="new-password" required />
              <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-text" style="font-size:0.75rem;">Uppercase, lowercase, digit &amp; special char</div>
            <div class="invalid-feedback" id="password-error" style="display:none;color:#dc3545;font-size:0.8rem;margin-top:4px;"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mt-4"><i class="bi bi-rocket-takeoff me-2"></i>Create Account</button>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:0.9rem;">
        Already have an account? <a href="/pages/auth/login.html">Login here</a>
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    ThemeManager.init();
    const regForm = document.getElementById("register-form");
    regForm.reset();
    setTimeout(() => {
      regForm.querySelectorAll('input').forEach((i) => { i.value = ""; });
    }, 50);
    AuthPage.requireLoggedOut();

    const nameInput = document.querySelector('input[name="fullName"]');
    const nameError = document.getElementById("name-error");

    function validateName() {
      const v = nameInput.value.trim();
      if (!v) {
        nameInput.classList.remove("is-invalid");
        nameError.style.display = "none";
        return true;
      }
      let msg = "";
      if (!/^[A-Z]/.test(v)) {
        msg = "Full name must start with a capital letter (A-Z).";
      } else if (!/^[A-Z][A-Za-z ]*$/.test(v)) {
        msg = "Numbers and special characters are not allowed. Use letters only.";
      }
      if (msg) {
        nameInput.classList.add("is-invalid");
        nameError.textContent = msg;
        nameError.style.display = "block";
        return false;
      }
      nameInput.classList.remove("is-invalid");
      nameError.style.display = "none";
      return true;
    }
    nameInput.addEventListener("input", validateName);

    const emailInput = document.querySelector('input[name="email"]');
    const emailError = document.getElementById("email-error");

    function validateEmail() {
      const v = emailInput.value.trim();
      if (!v) {
        emailInput.classList.remove("is-invalid");
        emailError.style.display = "none";
        return true;
      }
      const valid = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v);
      if (!valid) {
        emailInput.classList.add("is-invalid");
        emailError.textContent = "Please enter a valid email address.";
        emailError.style.display = "block";
        return false;
      }
      emailInput.classList.remove("is-invalid");
      emailError.style.display = "none";
      return true;
    }
    emailInput.addEventListener("input", validateEmail);

    const phoneInput = document.querySelector('input[name="phone"]');
    const phoneError = document.getElementById("phone-error");

    function validatePhone() {
      const v = phoneInput.value.trim();
      if (!v) {
        phoneInput.classList.remove("is-invalid");
        phoneError.style.display = "none";
        return true;
      }
      let msg = "";
      if (v.length !== 10) {
        msg = "Phone number must be exactly 10 digits.";
      } else if (!/^[6789]/.test(v)) {
        msg = "Phone number must start with 9, 8, 7 or 6.";
      } else if (!/^\d{10}$/.test(v)) {
        msg = "Only digits are allowed.";
      }
      if (msg) {
        phoneInput.classList.add("is-invalid");
        phoneError.textContent = msg;
        phoneError.style.display = "block";
        return false;
      }
      phoneInput.classList.remove("is-invalid");
      phoneError.style.display = "none";
      return true;
    }
    phoneInput.addEventListener("input", () => {
      let v = phoneInput.value.replace(/[^0-9]/g, "");
      if (v.length > 10) v = v.slice(0, 10);
      phoneInput.value = v;
      validatePhone();
    });

    const passwordInput = document.querySelector('input[name="password"]');
    const passwordError = document.getElementById("password-error");

    function validatePassword() {
      const v = passwordInput.value;
      if (!v) {
        passwordInput.classList.remove("is-invalid");
        passwordError.style.display = "none";
        return true;
      }
      let msg = "";
      if (v.length < 8) {
        msg = "Password must be at least 8 characters.";
      } else if (!/[A-Z]/.test(v)) {
        msg = "Password must contain an uppercase letter (A-Z).";
      } else if (!/[a-z]/.test(v)) {
        msg = "Password must contain a lowercase letter (a-z).";
      } else if (!/\d/.test(v)) {
        msg = "Password must contain a digit (0-9).";
      } else if (!/[@$!%*?&]/.test(v)) {
        msg = "Password must contain a special character (@ $ ! % * ? &).";
      }
      if (msg) {
        passwordInput.classList.add("is-invalid");
        passwordError.textContent = msg;
        passwordError.style.display = "block";
        return false;
      }
      passwordInput.classList.remove("is-invalid");
      passwordError.style.display = "none";
      return true;
    }
    passwordInput.addEventListener("input", validatePassword);

    document.querySelectorAll("[data-pw-toggle]").forEach((btn) =>
      btn.addEventListener("click", () => {
        const input = btn.closest(".input-icon").querySelector('input[type="password"], input[type="text"]');
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        validatePassword();
      })
    );

    AuthPage.bindForm("register-form", async (form) => {
      if (!validateName()) {
        throw new Error("Please correct the Full name field");
      }
      if (!validateEmail()) {
        throw new Error("Please enter a valid email address");
      }
      if (!validatePhone()) {
        throw new Error("Please correct the Phone number field");
      }
      if (!validatePassword()) {
        throw new Error("Please correct the Password field");
      }
      const data = Object.fromEntries(form.entries());
      delete data.rememberMe;
      if (data.cgpa === "") delete data.cgpa;
      const res = await API.post("/auth/register", data);
      localStorage.setItem("sp_verify_email", res.data && res.data.email ? res.data.email : data.email);
      UI.showToast("Registration successful! Verify your email to continue.", "success");
      setTimeout(() => (window.location.href = "/pages/auth/verify-email.html"), 1200);
    });
  </script>
</body>
</html>
