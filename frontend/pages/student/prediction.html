<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predict My Score - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    ThemeManager.init();
    if (!API.isAuthenticated()) window.location.href = "/pages/auth/login.html";

    UI.renderShell(UI.roleItems(), "/pages/student/prediction.html", "AI Score Prediction");
    const content = document.getElementById("page-content");

    content.innerHTML = `
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card p-4">
            <h6 class="fw-bold mb-1"><i class="bi bi-crystal me-2"></i>Predict My Performance</h6>
            <p class="text-muted small mb-3">Run the ML ensemble to predict your next exam score, grade, confidence and expected range.</p>
            <button class="btn btn-primary w-100 py-2" id="predict-btn"><i class="bi bi-magic me-2"></i>Run Prediction</button>
          </div>
        </div>
        <div class="col-lg-8">
          <div id="prediction-result">
            <div class="card p-5 text-center">
              <div class="icon" style="font-size:3rem;color:var(--text-muted);"><i class="bi bi-graph-up-arrow"></i></div>
              <p class="text-muted mb-0 mt-3">Click "Run Prediction" to generate your predicted result.</p>
            </div>
          </div>
        </div>
      </div>`;

    document.getElementById("predict-btn").addEventListener("click", async () => {
      const box = document.getElementById("prediction-result");
      box.innerHTML = `<div class="card p-5 text-center"><div class="spinner"></div><p class="text-muted mt-2 mb-0">Running machine learning prediction...</p></div>`;
      try {
        const [res, facRes, topicRes, histRes] = await Promise.all([
          API.get("/ai/predict"),
          API.get("/ai/performance-factors"),
          API.get("/ai/topic-prediction"),
          API.get("/tests/history"),
        ]);
        const p = res.data;
        const factors = (facRes.data && facRes.data.factors) || facRes.data || [];
        const topicData = topicRes.data || {};
        const topics = Array.isArray(topicData.topics) ? topicData.topics : [];
        const strongTopics = topicData.strongTopics || [];
        const averageTopics = topicData.averageTopics || [];
        const weakTopics = topicData.weakTopics || [];

        const history = (histRes.data && histRes.data.tests) || histRes.data || [];
        const completed = (Array.isArray(history) ? history : [])
          .filter((t) => t.status === "COMPLETED" && t.percentage != null)
          .sort((a, b) => new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0));
        const lastTest = completed.length ? Number(completed[0].percentage) : 0;
        const previousAvg = completed.length > 1
          ? completed.slice(1).reduce((s, t) => s + Number(t.percentage), 0) / (completed.length - 1)
          : lastTest;
        const currentPred = Number(p.predictedScore ?? 0);
        const targetScore = currentPred >= 90 ? 100 : currentPred >= 80 ? 90 : currentPred >= 70 ? 80 : currentPred >= 60 ? 70 : currentPred >= 50 ? 60 : 50;
        const score = Number(p.predictedScore ?? 0);
        const confidence = Number(p.confidenceScore ?? 0);
        const confLevel = confidence >= 80 ? "High" : confidence >= 60 ? "Medium" : "Low";
        const halfRange = Math.min(15, Math.max(2, Math.round((100 - confidence) * 0.4)));
        const lower = Math.max(0, score - halfRange);
        const upper = Math.min(100, score + halfRange);
        const category = score >= 75 ? "Good" : score >= 50 ? "Average" : "Needs Improvement";
        const confBadge = confLevel === "High" ? "badge-soft-green" : confLevel === "Medium" ? "badge-soft-orange" : "badge-soft-red";
        const catBadge = category === "Good" ? "badge-soft-green" : category === "Average" ? "badge-soft-orange" : "badge-soft-red";

        const factorRows = (Array.isArray(factors) ? factors : []).map((f) => {
          const status = f.status || "";
          const badge = status === "GOOD" ? "badge-soft-green"
            : status === "AVERAGE" ? "badge-soft-orange"
            : status === "POOR" ? "badge-soft-red" : "badge-soft";
          return `<tr>
            <td class="small">${UI.safeHtml(f.factor)}</td>
            <td class="text-end"><span class="badge ${badge}" style="font-size:1rem;">${UI.safeHtml(f.value)}</span></td>
          </tr>`;
        }).join("");

        const bySubject = {};
        topics.forEach((t) => {
          (bySubject[t.subjectName] = bySubject[t.subjectName] || []).push(t);
        });
        const subjectBlocks = Object.entries(bySubject).map(([subj, list]) => `
          <div class="mb-2">
            <div class="fw-semibold small mb-1"><i class="bi bi-journal-code me-1"></i>${UI.safeHtml(subj)}</div>
            <div class="border rounded p-2">
              ${list.map((t) => `
                <div class="d-flex justify-content-between small py-1" style="border-bottom:1px dashed rgba(127,127,127,0.2);">
                  <span class="text-muted">${UI.safeHtml(t.topicName)}</span>
                  <span class="fw-bold">${Number(t.score).toFixed(0)}%</span>
                </div>`).join("")}
            </div>
          </div>`).join("");
        const topicChips = (list) => list.map((t) => `
          <span class="badge badge-soft m-1" style="font-size:0.85rem;">${UI.safeHtml(t.topicName)} ${Number(t.score).toFixed(0)}%</span>`).join("");

        box.innerHTML = `
          <div class="card p-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-graph-up me-2"></i>Predict Result</h6>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Predicted Score</span>
              <span class="fs-2 fw-bold" style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${score}<span class="fs-6 text-muted" style="-webkit-text-fill-color:var(--text-muted);"> / 100</span></span>
            </div>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Predicted Percentage</span>
              <span class="fw-bold fs-5">${score}%</span>
            </div>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Predicted Grade</span>
              <span class="fw-bold fs-5">${UI.safeHtml(p.predictedGrade || "-")}</span>
            </div>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Confidence Level</span>
              <span><span class="badge ${confBadge}" style="font-size:1rem;">${confLevel}</span></span>
            </div>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Expected Score Range</span>
              <span class="fw-bold fs-5">${lower} \u2013 ${upper}</span>
            </div>
            <div class="border rounded p-3 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Performance Category</span>
              <span><span class="badge ${catBadge}" style="font-size:1rem;">${category}</span></span>
            </div>
          </div>

          <div class="card p-4 mt-3">
            <h6 class="fw-bold mb-1"><i class="bi bi-bar-chart-line me-2"></i>Performance Factors</h6>
            <p class="text-muted small mb-3">Show why the score is predicted.</p>
            ${factorRows ? `
            <table class="table table-borderless align-middle mb-0">
              <thead><tr>
                <th class="text-muted small fw-normal">Factor</th>
                <th class="text-end text-muted small fw-normal">Performance</th>
              </tr></thead>
              <tbody>${factorRows}</tbody>
            </table>` : `<p class="text-muted mb-0">No performance data available yet.</p>`}
          </div>

          <div class="card p-4 mt-3">
            <h6 class="fw-bold mb-3"><i class="bi bi-bar-chart me-2"></i>Score Comparison</h6>
            <p class="text-muted small mb-3">Previous performance against the predicted performance.</p>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Previous Average</span>
              <span class="fw-bold fs-5">${Math.round(previousAvg)}%</span>
            </div>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Last Test</span>
              <span class="fw-bold fs-5">${Math.round(lastTest)}%</span>
            </div>
            <div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Current Prediction</span>
              <span class="fw-bold fs-5" style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${Math.round(currentPred)}%</span>
            </div>
            <div class="border rounded p-3 d-flex justify-content-between align-items-center">
              <span class="text-muted small">Target Score</span>
              <span class="fw-bold fs-5">${targetScore}%</span>
            </div>
            <div class="progress mt-3" style="height:10px;">
              <div class="progress-bar" style="width:${Math.min(100, currentPred)}%;background:var(--gradient);"></div>
            </div>
            <div class="d-flex justify-content-between text-muted small mt-1">
              <span>0%</span><span>Target ${targetScore}%</span><span>100%</span>
            </div>
          </div>

          <div class="card p-4 mt-3">
            <h6 class="fw-bold mb-1"><i class="bi bi-diagram-3 me-2"></i>Subject / Topic Prediction</h6>
            <p class="text-muted small mb-3">Predicted scores by topic.</p>
            ${subjectBlocks || `<p class="text-muted mb-0">No topic performance data available yet. Take a test to build topic predictions.</p>`}
            <hr>
            <div class="row g-3">
              <div class="col-md-4">
                <div class="text-muted small mb-2"><i class="bi bi-check-circle me-1 text-success"></i>Strong Topics</div>
                <div>${strongTopics.length ? topicChips(strongTopics) : `<span class="text-muted small">None</span>`}</div>
              </div>
              <div class="col-md-4">
                <div class="text-muted small mb-2"><i class="bi bi-dash-circle me-1 text-warning"></i>Average Topics</div>
                <div>${averageTopics.length ? topicChips(averageTopics) : `<span class="text-muted small">None</span>`}</div>
              </div>
              <div class="col-md-4">
                <div class="text-muted small mb-2"><i class="bi bi-exclamation-circle me-1 text-danger"></i>Weak Topics</div>
                <div>${weakTopics.length ? topicChips(weakTopics) : `<span class="text-muted small">None</span>`}</div>
              </div>
            </div>
          </div>`;
      } catch (e) {
        box.innerHTML = `<div class="card p-5 text-center">
          <div class="icon" style="font-size:3rem;color:var(--danger);"><i class="bi bi-exclamation-octagon"></i></div>
          <p class="text-muted mt-3 mb-0">${UI.safeHtml(e.message)}</p>
        </div>`;
      }
    });
  </script>
</body>
</html>
