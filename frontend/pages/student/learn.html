<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/topic-resources.js"></script>
  <script src="/js/video-picker.js"></script>
  <script src="/js/player-progress.js"></script>
  <script src="/js/topic-quiz.js"></script>
  <script>
    ThemeManager.init();
    if (!API.isAuthenticated()) window.location.href = "/pages/auth/login.html";

    UI.renderShell(UI.roleItems(), "/pages/student/learn.html", "Learn");

    const content = document.getElementById("page-content");
    const safe = (v) => UI.safeHtml(v == null ? "" : String(v));
    const attr = (v) => safe(v).replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    const params = new URLSearchParams(window.location.search);
    const topicId = params.get("topicId");
    const topicName = params.get("topic") || "";
    const subjectName = params.get("subject") || "";
    const resourceTitle = params.get("title") || "";
    const resourceUrl = params.get("url") || "";
    const resourceType = (params.get("type") || "VIDEO").toUpperCase();

    // URL handling and the chooser live in the shared component, so the Learn
    // page and the My Subjects topic panel behave identically.
    const VP = window.VideoPicker;
    const httpUrl = VP.httpUrl;
    const incoming = VP.youtubeInfo(resourceUrl);
    // A YouTube search link is not embeddable, so it becomes "choose a video"
    // instead of a dead frame.
    const needsChooser = incoming.isYouTube && !incoming.videoId;
    const startQuery = incoming.query || topicName || subjectName;

    let quizHandle = null;
    // The live player, so "I have learned up to here" knows how far the
    // student has got. Replaced every time a different video is played and
    // stopped when the view is torn down.
    let playerHandle = null;
    let stopProgress = null;

    /**
     * Follows the embedded video and keeps the learning panel's idea of the
     * watch position current. The panel pushes the position to the server, and
     * the server uses it to trim the transcript the questions are written from,
     * so this is what makes the button mean what it says.
     */
    function trackPlayer(frame, isVideo) {
      stopTracking();
      if (!isVideo || !window.PlayerProgress || !frame) return;

      playerHandle = window.PlayerProgress.attach(frame, () => {
        if (quizHandle) quizHandle.refresh();
      });
      // Ten seconds is often enough for the panel to stay honest without
      // writing to the database on every tick of the clock.
      stopProgress = window.PlayerProgress.poll(playerHandle, () => true, 10000, () => {
        if (quizHandle) quizHandle.refresh();
      });
    }

    function stopTracking() {
      if (stopProgress) {
        stopProgress();
        stopProgress = null;
      }
      if (playerHandle) {
        playerHandle.destroy();
        playerHandle = null;
      }
    }

    // -------------------------------------------------------------- //
    // Player view
    // -------------------------------------------------------------- //
    function renderPlayer(chosen) {
      const isVideo = !!chosen.videoId;
      const outbound = httpUrl(chosen.url);
      const type = isVideo ? "VIDEO" : resourceType;
      const showSwitch = isVideo && needsChooser;

      content.innerHTML = `
        <div class="learn-view">
          <div class="learn-head">
            <div class="min-w-0">
              <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                <a class="btn btn-ghost btn-sm" href="/pages/student/subjects.html">
                  <i class="bi bi-arrow-left me-1"></i>My Subjects
                </a>
                ${subjectName ? `<span class="badge badge-soft">${safe(subjectName)}</span>` : ""}
                <span class="badge badge-soft-green">${safe(type)}</span>
              </div>
              <h5 class="fw-bold mb-0 text-truncate">${safe(chosen.title || topicName || "Learning resource")}</h5>
              <div class="text-muted small text-truncate">
                ${chosen.channel ? safe(chosen.channel) : safe(topicName)}
              </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              ${showSwitch ? `<button class="btn btn-sm btn-ghost" id="switch-video">
                <i class="bi bi-arrow-repeat me-1"></i>Change video</button>` : ""}
              ${outbound ? `<a class="btn btn-sm btn-primary" id="open-tab" href="${attr(outbound)}"
                 target="_blank" rel="noopener noreferrer">
                <i class="bi bi-box-arrow-up-right me-1"></i>Open in new tab
              </a>` : ""}
            </div>
          </div>

          <div class="learn-frame-wrap">
            ${isVideo
              ? VP.playerHtml(chosen.videoId, chosen.title || topicName)
              : outbound
                ? `<iframe id="learn-frame" class="learn-frame" src="${attr(outbound)}"
                     title="${attr(chosen.title || topicName)}"
                     referrerpolicy="strict-origin-when-cross-origin"
                     allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                     allowfullscreen></iframe>`
                : `<div class="empty-state">
                     <i class="bi bi-globe"></i>
                     <p class="mb-2">This link cannot be opened inside the page.</p>
                     ${outbound ? `<a class="btn btn-sm btn-primary" href="${attr(outbound)}" target="_blank" rel="noopener noreferrer">
                       Open in new tab</a>` : ""}
                   </div>`}
          </div>

          ${!isVideo ? `<p class="text-muted learn-hint">
            <i class="bi bi-info-circle me-1"></i>Some sites refuse to open inside a page.
            If the frame stays blank, use “Open in new tab” - the quiz and tracking still work.</p>` : ""}

          <div class="card p-3" id="learn-panel"></div>
        </div>`;

      const switchBtn = document.getElementById("switch-video");
      if (switchBtn) switchBtn.addEventListener("click", () => renderChooser());

      const frame = content.querySelector(".learn-frame");
      if (frame) {
        frame.addEventListener("load", () => {
          const wrap = document.querySelector(".learn-frame-wrap");
          if (wrap) wrap.classList.add("is-loaded");
        });
        // No load event after a few seconds usually means the site blocked framing.
        setTimeout(() => {
          const wrap = document.querySelector(".learn-frame-wrap");
          if (wrap && !wrap.classList.contains("is-loaded")) wrap.classList.add("is-blocked");
        }, 6000);
      }

      if (window.TopicQuiz) {
        // The picked video is what gets tracked, not the dead search link.
        const trackTitle = chosen.trackTitle || chosen.title;
        const trackUrl = chosen.trackUrl || outbound;
        quizHandle = window.TopicQuiz.attach(document.getElementById("learn-panel"), {
          topicId: Number(topicId),
          topicName: topicName,
          difficultyLevel: params.get("difficulty") || "",
          primaryVideoTitle: isVideo ? trackTitle : "",
          primaryVideoUrl: isVideo ? trackUrl : "",
          // Only a video has a position; a page is always read whole.
          watchPosition: () => (playerHandle ? playerHandle.position() : null),
        }, subjectName);
        if (!isVideo && trackUrl) quizHandle.record(type, trackTitle, trackUrl);
      }

      // Attached after the panel so the first position read is not lost.
      trackPlayer(content.querySelector(".learn-frame"), isVideo);
    }

    // -------------------------------------------------------------- //
    // Chooser view: turn a topic into a real, embeddable video
    // -------------------------------------------------------------- //
    // `auto` is used on arrival so the page opens on a playing video; the
    // student only sees this list if they press "Change video".
    function renderChooser(auto) {
      stopTracking();
      const q = startQuery || "";
      content.innerHTML = `
        <div class="learn-view">
          <div class="learn-head">
            <div class="min-w-0">
              <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                <a class="btn btn-ghost btn-sm" href="/pages/student/subjects.html">
                  <i class="bi bi-arrow-left me-1"></i>My Subjects
                </a>
                ${subjectName ? `<span class="badge badge-soft">${safe(subjectName)}</span>` : ""}
                <span class="badge badge-soft-green">VIDEO</span>
              </div>
              <h5 class="fw-bold mb-0">${auto ? "Finding a video for you" : "Choose a video"}</h5>
              <div class="text-muted small">${safe(resourceTitle || topicName)}</div>
            </div>
          </div>

          <div class="card p-3" id="chooser"></div>
        </div>`;

      VP.mount(document.getElementById("chooser"), {
        query: startQuery,
        autoPick: !!auto,
        onPick: (video) => {
          if (quizHandle) quizHandle.record("VIDEO", video.title, video.watchUrl);
          renderPlayer({ videoId: video.videoId, title: video.title, channel: video.channelTitle || "", url: video.watchUrl });
        },
      });
    }

    // -------------------------------------------------------------- //
    // Picker: choose a subject and topic to start learning
    // -------------------------------------------------------------- //
    async function renderPicker() {
      stopTracking();
      content.innerHTML = `
        <div class="card p-4">
          <h5 class="fw-bold mb-1"><i class="bi bi-collection-play me-2 text-primary"></i>Learn</h5>
          <p class="text-muted small">Pick a topic, choose a tutorial, and it plays here. Mark how far you got and get questions on exactly that.</p>
          <div id="picker"><div class="spinner"></div></div>
        </div>`;

      const box = document.getElementById("picker");
      let subjects = [];
      try {
        const res = await API.get("/subjects");
        const data = (res.data && res.data.subjects) || res.data || [];
        subjects = Array.isArray(data) ? data : [];
      } catch (e) {
        box.innerHTML = `<div class="empty-state"><p>${safe(e.message)}</p></div>`;
        return;
      }

      if (!subjects.length) {
        box.innerHTML = `<div class="empty-state"><i class="bi bi-book"></i><p>No subjects are available yet.</p></div>`;
        return;
      }

      box.innerHTML = `
        <label class="form-label small fw-semibold">Subject</label>
        <select class="form-select mb-3" id="pick-subject">
          ${subjects.map((s) => `<option value="${attr(s.subjectId)}">${safe(s.subjectName)}</option>`).join("")}
        </select>
        <div id="pick-topics"><div class="spinner"></div></div>`;

      const subjectSelect = document.getElementById("pick-subject");
      const loadTopics = async () => {
        const area = document.getElementById("pick-topics");
        area.innerHTML = `<div class="spinner"></div>`;
        const sid = subjectSelect.value;
        const subject = subjects.find((s) => String(s.subjectId) === String(sid)) || {};
        try {
          const res = await API.get(`/subjects/${sid}/topics`);
          const topics = (res.data && res.data.topics) || res.data || [];
          if (!topics.length) {
            area.innerHTML = `<div class="empty-state py-3"><p class="mb-0">No topics in this subject.</p></div>`;
            return;
          }
          area.innerHTML = topics.map((t) => {
            const first = primaryResource(t, subject);
            return `
            <div class="border rounded p-2 mb-2">
              <div class="d-flex justify-content-between align-items-start gap-2">
                <div class="min-w-0">
                  <div class="fw-semibold small">${safe(t.topicName)}</div>
                  <div class="text-muted" style="font-size:.75rem">${safe(t.difficultyLevel || "")} &middot; ${t.estimatedHours ?? "-"} hrs</div>
                </div>
                ${first ? `<a class="btn btn-sm btn-primary text-nowrap" href="${attr(first.href)}">
                    <i class="bi bi-play-circle me-1"></i>Open</a>`
                  : `<span class="badge badge-soft">No resource</span>`}
              </div>
            </div>`;
          }).join("");
        } catch (e) {
          area.innerHTML = `<div class="empty-state py-3"><p class="mb-0">${safe(e.message)}</p></div>`;
        }
      };

      subjectSelect.addEventListener("change", loadTopics);
      loadTopics();
    }

    /** The resource the "Open" button sends the student to: first video, else first doc. */
    function primaryResource(topic, subject) {
      if (!window.TopicResources) return null;
      const data = window.TopicResources.forTopic({
        subjectName: subject.subjectName || "",
        subjectCode: subject.subjectCode || "",
        topicName: topic.topicName,
        difficultyLevel: topic.difficultyLevel,
        description: topic.description,
        estimatedHours: topic.estimatedHours,
      });
      const video = (data.videos || [])[0];
      const doc = (data.docs || [])[0];
      const pick = video || doc;
      if (!pick) return null;
      const type = video ? "VIDEO" : "DOC";
      return {
        title: pick.title,
        url: pick.url,
        type,
        href: learnHref({
          topicId: topic.topicId, topic: topic.topicName, subject: subject.subjectName || "",
          type, title: pick.title, url: pick.url, difficulty: topic.difficultyLevel,
        }),
      };
    }

    function learnHref(o) {
      const q = new URLSearchParams();
      if (o.topicId) q.set("topicId", o.topicId);
      if (o.topic) q.set("topic", o.topic);
      if (o.subject) q.set("subject", o.subject);
      if (o.type) q.set("type", o.type);
      if (o.title) q.set("title", o.title);
      if (o.url) q.set("url", o.url);
      if (o.difficulty) q.set("difficulty", o.difficulty);
      return `/pages/student/learn.html?${q.toString()}`;
    }
    window.LearnModule = { learnHref };

    if (!topicId || !resourceUrl) {
      renderPicker();
    } else if (!httpUrl(resourceUrl)) {
      content.innerHTML = `<div class="card p-4"><div class="empty-state">
        <i class="bi bi-globe"></i>
        <p>This link is not a valid web address, so it cannot be opened.</p>
        <a class="btn btn-sm btn-ghost" href="/pages/student/subjects.html">Back to My Subjects</a>
      </div></div>`;
    } else if (needsChooser) {
      // A YouTube search link: go straight to a real video. "Change video"
      // reopens the list if the student prefers a different channel.
      renderChooser(true);
    } else {
      renderPlayer({
        videoId: incoming.videoId,
        title: resourceTitle,
        channel: "",
        url: resourceUrl,
      });
    }
  </script>
</body>
</html>
