<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    ThemeManager.init();
    if (!API.isAuthenticated()) window.location.href = "/pages/auth/login.html";

    UI.renderShell(UI.roleItems(), "/pages/student/chatbot.html", "AI Chat Assistant");
    const content = document.getElementById("page-content");

    content.innerHTML = `
      <div class="chat-box">
        <div class="chat-header d-flex align-items-center gap-2 p-3 border-bottom">
          <div class="avatar" style="width:40px;height:40px;"><i class="bi bi-robot"></i></div>
          <div>
            <div class="fw-bold">EduAssistant</div>
            <div class="text-muted" style="font-size:0.75rem;">Your AI study companion</div>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg bot">Hi! 👋 I'm your AI study assistant. Ask me about your performance, how to improve weak topics, or any study question!</div>
        </div>
        <div class="chat-input-bar">
          <input type="text" class="form-control" id="chat-input" placeholder="Ask me anything about your studies..." />
          <button class="btn btn-primary" id="chat-send"><i class="bi bi-send"></i></button>
        </div>
      </div>`;

    const messages = document.getElementById("chat-messages");
    const input = document.getElementById("chat-input");
    const history = [];

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = `chat-msg ${who}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      const typing = document.createElement("div");
      typing.className = "chat-msg bot";
      typing.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Thinking...';
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;
      try {
        const res = await API.post("/chatbot/chat", {
          message: text,
          history: history.slice(-10),
        });
        typing.remove();
        const reply = res.data.reply || "I'm not sure how to answer that. Could you rephrase?";
        addMessage(reply, "bot");
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: reply });
      } catch (e) {
        typing.remove();
        addMessage("Sorry, I couldn't reach the AI service. " + e.message, "bot");
      }
    }

    document.getElementById("chat-send").addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
