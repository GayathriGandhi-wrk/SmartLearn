<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Subjects - Smart Learn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    ThemeManager.init();
    if (!API.isAuthenticated()) window.location.href = "/pages/auth/login.html";

    UI.renderShell(UI.roleItems(), "/pages/student/subjects.html", "My Subjects");
    const content = document.getElementById("page-content");

    content.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
          <h5 class="fw-bold mb-1">Subjects &amp; Topics</h5>
          <span class="text-muted small">Browse your subjects and their topics</span>
        </div>
        <button class="btn btn-outline-primary" id="refresh-btn"><i class="bi bi-arrow-clockwise me-2"></i>Refresh Performance</button>
      </div>
      <div class="row g-3" id="subject-cards"><div class="col-12"><div class="spinner"></div></div></div>`;

    async function loadSubjects() {
      const box = document.getElementById("subject-cards");
      try {
        const res = await API.get("/subjects");
        const subjects = res.data && (res.data.subjects || Array.isArray(res.data) ? res.data : []);
        if (!subjects.length) {
          box.innerHTML = `<div class="col-12"><div class="empty-state"><i class="bi bi-book"></i><p>No subjects available.</p></div></div>`;
          return;
        }
        box.innerHTML = subjects.map((s) => `
          <div class="col-md-6 col-xl-4">
            <div class="card card-hover h-100 p-3">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge badge-soft">${UI.safeHtml(s.subjectCode)}</span>
                <span class="text-muted small">Sem ${s.semester}</span>
              </div>
              <h6 class="fw-bold mb-1">${UI.safeHtml(s.subjectName)}</h6>
              <p class="text-muted small mb-2">${UI.safeHtml(s.description || "")}</p>
              <div class="d-flex justify-content-between small text-muted mb-3">
                <span><i class="bi bi-collection me-1"></i>${s.topicCount} topics</span>
                <span><i class="bi bi-card-text me-1"></i>${s.questionCount} questions</span>
              </div>
              <button class="btn btn-sm btn-ghost w-100" data-subject-id="${s.subjectId}" data-subject-name="${UI.safeHtml(s.subjectName)}">
                <i class="bi bi-eye me-1"></i>View Topics
              </button>
            </div>
          </div>`).join("");

        box.querySelectorAll("[data-subject-id]").forEach((btn) =>
          btn.addEventListener("click", () => showTopics(btn.dataset.subjectId, btn.dataset.subjectName))
        );
      } catch (e) {
        box.innerHTML = `<div class="col-12"><div class="empty-state"><i class="bi bi-exclamation-circle"></i><p>${UI.safeHtml(e.message)}</p></div></div>`;
      }
    }

    function showTopics(subjectId, subjectName) {
      const box = document.getElementById("subject-cards");
      box.innerHTML = `<div class="col-12"><div class="spinner"></div></div>`;
      box.innerHTML = `
        <div class="col-12">
          <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-ghost btn-sm" onclick="loadSubjects()"><i class="bi bi-arrow-left me-1"></i>Back</button>
            <h5 class="fw-bold mb-0">${UI.safeHtml(subjectName)} - Topics</h5>
          </div>
        </div>`;
      const topicRow = document.createElement("div");
      topicRow.className = "col-12";
      box.appendChild(topicRow);
      topicRow.innerHTML = `<div class="spinner"></div>`;
      API.get(`/subjects/${subjectId}/topics`)
        .then((res) => {
          const topics = res.data && (res.data.topics || Array.isArray(res.data) ? res.data : []);
          if (!topics.length) {
            topicRow.innerHTML = `<div class="empty-state"><i class="bi bi-folder-x"></i><p>No topics found.</p></div>`;
            return;
          }
          const diffClass = { BEGINNER: "badge-soft-green", INTERMEDIATE: "badge-soft-orange", ADVANCED: "badge-soft-red" };
          topicRow.innerHTML = `
            <div class="table-responsive"><table class="table table-hover">
              <thead><tr><th>Topic</th><th>Difficulty</th><th>Est. Hours</th><th>Description</th></tr></thead>
              <tbody>${topics.map((t) => `
                <tr>
                  <td class="fw-semibold">${UI.safeHtml(t.topicName)}</td>
                  <td><span class="badge ${diffClass[t.difficultyLevel] || "badge-soft"}">${UI.safeHtml(t.difficultyLevel || "")}</span></td>
                  <td>${t.estimatedHours ?? "-"} hrs</td>
                  <td class="text-muted small">${UI.safeHtml(t.description || "")}</td>
                </tr>`).join("")}
              </tbody>
            </table></div>`;
        })
        .catch((e) => { topicRow.innerHTML = `<div class="empty-state"><p>${UI.safeHtml(e.message)}</p></div>`; });
    }

    document.getElementById("refresh-btn").addEventListener("click", async () => {
      try {
        const res = await API.get("/subjects/performance");
        const perf = res.data;
        UI.showToast(`Overall accuracy: ${perf.overallAccuracy ?? "N/A"}%`, "success");
      } catch (e) { UI.showToast(e.message, "danger"); }
    });

    loadSubjects();
    window.loadSubjects = loadSubjects;
  </script>
</body>
</html>
